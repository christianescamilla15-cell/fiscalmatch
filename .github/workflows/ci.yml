# CI (N02, N03, N07, N08b, N09): pruebas por regla contra PostgreSQL REAL, paridad contra el lote golden,
# contrato OpenAPI al día, build del portal e imágenes de producción construidas y ARRANCADAS.
# Plantilla común del portafolio adaptada a FiscalMatch (backend/ FastAPI + PostgreSQL, frontend/ React/Vite).
#
# Un job «skipped» por depender de otro en rojo NO es verde: en la rama protegida (main) todos los jobs de
# este flujo y los de seguridad.yml deben ser checks requeridos.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: pruebas backend (Python 3.12 · ${{ matrix.bd }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # postgresql es la base de producción y la que manda; sqlite cuida que `make test` siga sirviendo en local.
        bd: [postgresql, sqlite]
    services:
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_USER: fiscalmatch
          POSTGRES_PASSWORD: solo-para-ci
          POSTGRES_DB: fiscalmatch_pruebas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fiscalmatch -d fiscalmatch_pruebas" --health-interval 5s
          --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      # Con FM_EXIGIR_POSTGRES=1 la suite FALLA si no corre sobre PostgreSQL (no se salta en silencio).
      FM_TEST_DATABASE_URL: ${{ matrix.bd == 'postgresql' && 'postgresql+psycopg://fiscalmatch:solo-para-ci@localhost:5432/fiscalmatch_pruebas' || '' }}
      FM_EXIGIR_POSTGRES: ${{ matrix.bd == 'postgresql' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: estilo (ruff, configuración del repo)
        run: ruff check ..
      # pytest sale con 5 si no encontró pruebas: eso ya falla. La cobertura se reporta, no es la compuerta;
      # la compuerta es una prueba por regla (docs/reglas.md), la paridad golden y los controles negativos.
      - run: pytest -q --junitxml=reporte.xml --cov=app --cov-report=xml --cov-report=term
      - run: python3 ../herramientas/verificar_reportes.py pytest reporte.xml
      - name: golden y contrato al día (también lo exigen las pruebas)
        run: |
          python tests/golden/generar_lote.py --revisar
          python ../herramientas/exportar_openapi.py --revisar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pruebas-${{ matrix.bd }}
          path: |
            backend/reporte.xml
            backend/coverage.xml

  front:
    name: front (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test --if-present
      # `npm run build` corre `tsc --noEmit` (tipos estrictos) antes de empaquetar.
      - run: npm run build

  # Las imágenes son las que levanta docker-compose (no hay despliegue en la nube: ver RUNBOOK.md). Lección de
  # Verificarro (19-nov): el CI probaba en 3.12 y la imagen traía 3.10; todo salía en verde y la imagen no servía.
  imagen:
    name: imágenes (construcción y arranque contra PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_USER: fiscalmatch
          POSTGRES_PASSWORD: solo-para-ci
          POSTGRES_DB: fiscalmatch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fiscalmatch -d fiscalmatch" --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: construir las imágenes (los mismos Dockerfile que usa docker-compose)
        run: |
          docker build -t fiscalmatch-api:ci backend
          docker build -t fiscalmatch-web:ci frontend
      - name: el Python de la imagen es el mismo que prueba el CI
        run: >-
          docker run --rm --entrypoint python3 fiscalmatch-api:ci
          -c "import sys; v = sys.version_info[:2]; print('Python de la imagen:', sys.version);
          assert v == (3, 12), f'la imagen trae {v}, el CI prueba 3.12'"
      - name: las imágenes no corren como root y la de la API no trae herramientas de pruebas
        run: |
          test "$(docker run --rm --entrypoint id fiscalmatch-api:ci -u)" != "0"
          test "$(docker run --rm --entrypoint id fiscalmatch-web:ci -u)" != "0"
          if docker run --rm --entrypoint python3 fiscalmatch-api:ci -c "import pytest" 2>/dev/null; then
            echo "::error::la imagen de producción trae pytest (requirements-dev.txt no debe instalarse ahí)"
            exit 1
          fi
      - name: arrancar API y portal, y correr la prueba de humo
        run: |
          docker run -d --name api --network host \
            -e FM_DATABASE_URL=postgresql+psycopg://fiscalmatch:solo-para-ci@localhost:5432/fiscalmatch \
            -e FM_JWT_SECRET=solo-para-ci-no-es-un-secreto \
            fiscalmatch-api:ci
          # nginx del portal reenvía /api al host «api» de compose: aquí es la API en el host.
          docker run -d --name web --network host --add-host api:127.0.0.1 fiscalmatch-web:ci
          herramientas/humo.sh http://localhost:8000 http://localhost:5173
      - name: bitácoras si algo falló
        if: failure()
        run: |
          docker logs api 2>&1 | tail -80
          docker logs web 2>&1 | tail -40
