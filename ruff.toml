# ruff: la misma configuración en local y en el CI (no depende de la del equipo de quien lo corre).
target-version = "py312"
line-length = 110
# herramientas/confidencialidad.py y verificar_reportes.py son copias literales de la plantilla común del
# portafolio (con su propio largo de línea): no se reescriben en cada repo. exportar_openapi.py sí se revisa.
extend-exclude = ["frontend", ".venv-calidad", "herramientas/confidencialidad.py", "herramientas/verificar_reportes.py"]

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "B008",   # Depends()/Query()/File() en los valores por omisión es el idioma de FastAPI
  "UP042",  # (str, Enum) → StrEnum cambia str() de los miembros que SQLAlchemy guarda: no es cosmético
]

[lint.isort]
known-first-party = ["app"]
# Módulos de apoyo de backend/tests (pytest los pone en sys.path).
known-local-folder = ["apoyo", "conftest", "paridad"]
